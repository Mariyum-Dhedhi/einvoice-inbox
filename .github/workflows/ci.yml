name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow token can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs, not movable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore EInvoice.slnx --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build EInvoice.slnx --no-restore --configuration Release --warnaserror

      - name: Test
        run: >
          dotnet test EInvoice.slnx --no-build --configuration Release
          --logger "trx;LogFilePrefix=results"
          --results-directory TestResults

      - name: Vulnerable package check
        run: |
          dotnet list EInvoice.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          retention-days: 14
