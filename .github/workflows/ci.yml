name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow token can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs, not movable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore EInvoice.slnx --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build EInvoice.slnx --no-restore --configuration Release --warnaserror

      - name: Test (no database)
        run: >
          dotnet test EInvoice.slnx --no-build --configuration Release
          --filter "Category!=Database&Category!=Kosit&Category!=E2E&Category!=Ollama"
          --logger "trx;LogFilePrefix=results"
          --results-directory TestResults

      - name: Migration drift check
        run: |
          dotnet tool restore
          E="--project src/EInvoice.Infrastructure --startup-project src/EInvoice.Infrastructure --no-build --configuration Release"
          # Fails if the EF model changed without a new migration.
          dotnet ef migrations has-pending-model-changes $E
          # Fails if db/migrations/schema.sql was not regenerated after the last migration.
          dotnet ef migrations script --idempotent $E -o db/migrations/schema.sql
          git diff --exit-code -- db/migrations/schema.sql \
            || { echo "::error::db/migrations/schema.sql is out of date. Regenerate it (see db/README.md)."; exit 1; }

      - name: Vulnerable package check
        run: |
          dotnet list EInvoice.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  # Proves "docker compose up gives a seeded database" with the security checks, then runs the database tests.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Generate throwaway passwords
        run: |
          sa="Sa$(openssl rand -hex 16)#1"
          app="Ap$(openssl rand -hex 16)#2"
          echo "::add-mask::$sa"
          echo "::add-mask::$app"
          printf 'MSSQL_SA_PASSWORD=%s\nEINVOICE_APP_PASSWORD=%s\n' "$sa" "$app" > .env
          echo "EINVOICE_APP_PASSWORD=$app" >> "$GITHUB_ENV"

      - name: docker compose up
        run: |
          docker compose up -d --wait sqlserver
          docker compose run --rm db-init

      - name: Security and constraint checks (as the app user)
        run: >
          docker exec -e SQLCMDPASSWORD="$EINVOICE_APP_PASSWORD" -i einvoice-sqlserver
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U einvoice_app -d EInvoice -C -b -I
          < db/tests/verify.sql

      - name: db-init is idempotent
        run: docker compose run --rm db-init | tee second-run.log && grep -q "already present; skipping" second-run.log

      # Database tests start their own SQL Server with Testcontainers, built from the same db/ scripts.
      - name: Database tests (Testcontainers)
        run: >
          dotnet test tests/EInvoice.IntegrationTests --configuration Release
          --filter "Category=Database"
          --logger "trx;LogFilePrefix=database"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-test-results
          path: TestResults
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v

  # The KoSIT validator container: built from checksum-verified downloads; every official sample must be accepted.
  kosit-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Throwaway .env (compose validates every service's variables)
        run: printf 'MSSQL_SA_PASSWORD=Unused%s#1\nEINVOICE_APP_PASSWORD=Unused%s#2\n' "$(openssl rand -hex 8)" "$(openssl rand -hex 8)" > .env

      - name: Build and start the validator (fails if a download checksum differs)
        run: docker compose up -d --build --wait kosit-validator

      - name: Hardening is in place
        run: |
          docker inspect einvoice-kosit-validator --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}}' | tee hardening.txt
          grep -q '^10001:10001 true \[ALL\]$' hardening.txt

      - name: All official samples accepted, tampered sample rejected
        env:
          EINVOICE_KOSIT_URL: http://127.0.0.1:8081/
        run: >
          dotnet test tests/EInvoice.IntegrationTests --configuration Release
          --filter "Category=Kosit"
          --logger "trx;LogFilePrefix=kosit"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kosit-test-results
          path: TestResults
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down

  # The browser test: upload an invoice in Chromium and see its result (Testcontainers SQL Server, app on Kestrel).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore EInvoice.slnx --locked-mode

      - name: Build
        run: dotnet build tests/EInvoice.IntegrationTests --no-restore --configuration Release --warnaserror

      # The browser build is the one this exact Playwright package version is made for.
      - name: Install Chromium
        run: pwsh tests/EInvoice.IntegrationTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # The journeys run the app over HTTPS (Secure cookies); Kestrel uses the development certificate.
      - name: Development certificate
        run: dotnet dev-certs https

      # The README's screenshot journey writes its picture with the test results (artifact e2e-test-results).
      - name: Browser test
        env:
          EINVOICE_SCREENSHOT_DIR: ${{ github.workspace }}/TestResults/screenshots
        run: >
          dotnet test tests/EInvoice.IntegrationTests --no-build --configuration Release
          --filter "Category=E2E"
          --logger "trx;LogFilePrefix=e2e"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: TestResults
          retention-days: 14

  # ZAP baseline scans of the running app, public and signed in as a clerk (tests/zap). Any alert not listed with a
  # reason in tests/zap/rules.tsv fails the job.
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Generate throwaway passwords
        run: |
          sa="Sa$(openssl rand -hex 16)#1"
          app="Ap$(openssl rand -hex 16)#2"
          demo="Demo$(openssl rand -hex 16)"
          echo "::add-mask::$sa"
          echo "::add-mask::$app"
          echo "::add-mask::$demo"
          printf 'MSSQL_SA_PASSWORD=%s\nEINVOICE_APP_PASSWORD=%s\n' "$sa" "$app" > .env
          echo "EINVOICE_APP_PASSWORD=$app" >> "$GITHUB_ENV"
          echo "ZAP_PASSWORD=$demo" >> "$GITHUB_ENV"

      - name: docker compose up (database)
        run: |
          docker compose up -d --wait sqlserver
          docker compose run --rm db-init

      - name: Restore (locked)
        run: dotnet restore EInvoice.slnx --locked-mode

      - name: Build
        run: dotnet build src/EInvoice.Web --no-restore --configuration Release --warnaserror

      - name: Development certificate
        run: dotnet dev-certs https

      # Development: the demo accounts (clerk@example.com) exist only there, with the throwaway password. Started from
      # the project folder: that is its content root (static web assets, appsettings).
      - name: Start the app
        run: |
          ConnectionStrings__EInvoice="Server=127.0.0.1,1433;Database=EInvoice;User Id=einvoice_app;Password=$EINVOICE_APP_PASSWORD;Encrypt=True;TrustServerCertificate=True" \
          DemoUsers__Password="$ZAP_PASSWORD" \
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=https://localhost:7169 Logging__LogLevel__Default=Warning \
          sh -c 'cd src/EInvoice.Web && exec dotnet bin/Release/net10.0/EInvoice.Web.dll' > app.log 2>&1 &
          for i in $(seq 1 60); do
            [ "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:7169/account/login)" = 200 ] && exit 0
            sleep 1
          done
          cat app.log
          exit 1

      - name: ZAP baseline (public and signed in)
        run: ZAP_NETWORK=host ZAP_REPORTS="$PWD/zap-reports" sh tests/zap/scan.sh https://localhost:7169

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reports
          path: |
            zap-reports/*.html
            zap-reports/*.json
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v

  # The public demo's stack (docker compose --profile public, docs/self-hosting.md): the app image builds from locked
  # packages, runs hardened inside the tunnel's network, speaks German (ICU is in the image), is published on loopback
  # only, and signs a demo visitor in through the database. The tunnel starts without a key here: no public link from CI.
  public-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Throwaway .env
        run: printf 'MSSQL_SA_PASSWORD=Unused%s#1\nEINVOICE_APP_PASSWORD=Unused%s#2\nERP_CLIENT_SECRET=Unused%s\nAI_ENABLED=false\n' "$(openssl rand -hex 8)" "$(openssl rand -hex 8)" "$(openssl rand -hex 16)" > .env

      - name: Build and start the public stack
        run: docker compose --profile public up -d --build --wait

      - name: The app is hardened and lives in the tunnel's network
        run: |
          docker inspect einvoice-web --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.NetworkMode}}' | tee web.txt
          grep -Eq '^1654:1654 true \[ALL\] container:' web.txt
          docker inspect einvoice-tailscale --format '{{.HostConfig.CapDrop}} {{.HostConfig.SecurityOpt}}' | tee tunnel.txt
          grep -q '^\[ALL\] \[no-new-privileges:true\]$' tunnel.txt

      - name: The nightly reset is waiting for 03:00 Berlin time, hardened
        run: |
          for i in $(seq 1 30); do docker logs einvoice-demo-reset 2>&1 | grep -q '^Next reset: .* 03:00 CE' && break; sleep 2; done
          docker logs einvoice-demo-reset 2>&1 | tee reset.txt
          grep -Eq '^Next reset: [0-9-]+ 03:00 CES?T$' reset.txt
          docker inspect einvoice-demo-reset --format '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}}' | grep -q '^true \[ALL\]$'

      - name: Nothing of the public stack is published on the machine
        run: |
          docker compose --profile public ps --format '{{.Name}} {{.Ports}}' | tee ports.txt
          ! grep -E '^einvoice-(web|tailscale) .*->' ports.txt
          ! grep -E '0\.0\.0\.0|:::' ports.txt

      - name: German, HTTPS as the tunnel says, and a demo visitor signs in (checked from inside the tunnel's network)
        run: >
          docker run --rm --network container:einvoice-tailscale -v "$PWD/tests/public-stack:/check:ro"
          --entrypoint sh einvoice-kosit-validator:1.6.3-xr-2026-08-31 /check/check.sh

      - name: Logs
        if: failure()
        run: docker compose --profile public logs --no-color web tailscale demo-reset | tail -200

      - name: Tear down
        if: always()
        run: docker compose --profile public down -v

  # The ERP sync (sync/erp-sync, Go, package 16c): formatting, go vet and the tests with the race detector, in the same
  # pinned Go image the Dockerfile builds with (one Go version everywhere). Then the image builds and refuses to start
  # without its settings, read-only and as a non-root user.
  erp-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: gofmt, go vet, go test -race
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo/sync/erp-sync
          golang:1.27.3-bookworm@sha256:dc0963f32053e4bc451d24d87e3892d42d01021b61f093e98eb95c0352bb84b0
          sh test.sh

      - name: The image builds, runs read-only as non-root and names missing settings
        run: |
          docker build -t erp-sync:ci sync/erp-sync
          docker image inspect erp-sync:ci --format '{{.Config.User}}' | grep -qx '65532:65532'
          set +e; docker run --rm --read-only erp-sync:ci > start.txt 2>&1; code=$?; set -e
          cat start.txt
          test "$code" -eq 2
          grep -q 'ERP_CLIENT_SECRET is required' start.txt

  # The ERP sync end to end on the real stack (tests/erp-sync/e2e.sh): mock ERP -> erp-sync -> app -> SQL Server. Full
  # load of 10,000 orders, a rerun that changes nothing, 10 changes, a run killed halfway and one with 30 % chaos; after
  # each completed run the app's data equals the ERP's line for line. Its own Compose project, throwaway secrets.
  erp-sync-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: E2E
        run: bash tests/erp-sync/e2e.sh
