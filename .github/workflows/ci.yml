name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow token can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs, not movable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore EInvoice.slnx --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build EInvoice.slnx --no-restore --configuration Release --warnaserror

      - name: Test (no database)
        run: >
          dotnet test EInvoice.slnx --no-build --configuration Release
          --filter "Category!=Database&Category!=Kosit&Category!=E2E"
          --logger "trx;LogFilePrefix=results"
          --results-directory TestResults

      - name: Migration drift check
        run: |
          dotnet tool restore
          E="--project src/EInvoice.Infrastructure --startup-project src/EInvoice.Infrastructure --no-build --configuration Release"
          # Fails if the EF model changed without a new migration.
          dotnet ef migrations has-pending-model-changes $E
          # Fails if db/migrations/schema.sql was not regenerated after the last migration.
          dotnet ef migrations script --idempotent $E -o db/migrations/schema.sql
          git diff --exit-code -- db/migrations/schema.sql \
            || { echo "::error::db/migrations/schema.sql is out of date. Regenerate it (see db/README.md)."; exit 1; }

      - name: Vulnerable package check
        run: |
          dotnet list EInvoice.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  # Proves "docker compose up gives a seeded database" with the security checks, then runs the database tests.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Generate throwaway passwords
        run: |
          sa="Sa$(openssl rand -hex 16)#1"
          app="Ap$(openssl rand -hex 16)#2"
          echo "::add-mask::$sa"
          echo "::add-mask::$app"
          printf 'MSSQL_SA_PASSWORD=%s\nEINVOICE_APP_PASSWORD=%s\n' "$sa" "$app" > .env
          echo "EINVOICE_APP_PASSWORD=$app" >> "$GITHUB_ENV"

      - name: docker compose up
        run: |
          docker compose up -d --wait sqlserver
          docker compose run --rm db-init

      - name: Security and constraint checks (as the app user)
        run: >
          docker exec -e SQLCMDPASSWORD="$EINVOICE_APP_PASSWORD" -i einvoice-sqlserver
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U einvoice_app -d EInvoice -C -b -I
          < db/tests/verify.sql

      - name: db-init is idempotent
        run: docker compose run --rm db-init | tee second-run.log && grep -q "already present; skipping" second-run.log

      # Database tests start their own SQL Server with Testcontainers, built from the same db/ scripts.
      - name: Database tests (Testcontainers)
        run: >
          dotnet test tests/EInvoice.IntegrationTests --configuration Release
          --filter "Category=Database"
          --logger "trx;LogFilePrefix=database"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-test-results
          path: TestResults
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v

  # The KoSIT validator container: built from checksum-verified downloads; every official sample must be accepted.
  kosit-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Throwaway .env (compose validates every service's variables)
        run: printf 'MSSQL_SA_PASSWORD=Unused%s#1\nEINVOICE_APP_PASSWORD=Unused%s#2\n' "$(openssl rand -hex 8)" "$(openssl rand -hex 8)" > .env

      - name: Build and start the validator (fails if a download checksum differs)
        run: docker compose up -d --build --wait kosit-validator

      - name: Hardening is in place
        run: |
          docker inspect einvoice-kosit-validator --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}}' | tee hardening.txt
          grep -q '^10001:10001 true \[ALL\]$' hardening.txt

      - name: All official samples accepted, tampered sample rejected
        env:
          EINVOICE_KOSIT_URL: http://127.0.0.1:8081/
        run: >
          dotnet test tests/EInvoice.IntegrationTests --configuration Release
          --filter "Category=Kosit"
          --logger "trx;LogFilePrefix=kosit"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kosit-test-results
          path: TestResults
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down

  # The browser test: upload an invoice in Chromium and see its result (Testcontainers SQL Server, app on Kestrel).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore EInvoice.slnx --locked-mode

      - name: Build
        run: dotnet build tests/EInvoice.IntegrationTests --no-restore --configuration Release --warnaserror

      # The browser build is the one this exact Playwright package version is made for.
      - name: Install Chromium
        run: pwsh tests/EInvoice.IntegrationTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Browser test
        run: >
          dotnet test tests/EInvoice.IntegrationTests --no-build --configuration Release
          --filter "Category=E2E"
          --logger "trx;LogFilePrefix=e2e"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: TestResults
          retention-days: 14
