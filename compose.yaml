name: einvoice-inbox

x-sqlserver-image: &sqlserver-image mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04

services:
  sqlserver:
    image: *sqlserver-image
    container_name: einvoice-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Required. Set it in .env (copy .env.example). Never commit the real value.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env - see .env.example}
    ports:
      # Loopback only: the database is not reachable from other machines.
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # Password via SQLCMDPASSWORD, not -P, so it does not appear in process listings.
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: creates the database, applies migrations, creates the app user, loads seed data, then exits.
  db-init:
    image: *sqlserver-image
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env - see .env.example}
      EINVOICE_APP_PASSWORD: ${EINVOICE_APP_PASSWORD:?Set EINVOICE_APP_PASSWORD in .env - see .env.example}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/init.sh"]
    restart: "no"

  # KoSIT validator (EN 16931 + XRechnung 3.0.2). Built from pinned, checksum-verified downloads; see docker/kosit-validator.
  kosit-validator:
    build: ./docker/kosit-validator
    image: einvoice-kosit-validator:1.6.3-xr-2026-08-31
    container_name: einvoice-kosit-validator
    ports:
      - "127.0.0.1:${KOSIT_PORT:-8081}:8080"
    # Hardening: read-only filesystem, no Linux capabilities, no privilege escalation, bounded memory.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/server/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Mock ERP: the vendor-invoice endpoint the posting worker sends approved invoices to (contracts/d365), and its token
  # endpoint (OAuth 2.0 client credentials). It needs ERP_CLIENT_SECRET in .env and refuses to start without it. Run the
  # app with Erp__Enabled=true, Erp__BaseUrl=http://127.0.0.1:8090/ and the same client id and secret to post to it.
  mock-erp:
    build:
      context: .
      dockerfile: docker/mock-erp/Dockerfile
    image: einvoice-mock-erp:local
    container_name: einvoice-mock-erp
    ports:
      - "127.0.0.1:${MOCK_ERP_PORT:-8090}:8080"
    environment:
      Auth__ClientId: ${ERP_CLIENT_ID:-einvoice}
      Auth__ClientSecret: ${ERP_CLIENT_SECRET:-}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  # ---- The public demo: docker compose --profile public up -d (docs/self-hosting.md) --------------------------------
  # Tailscale Funnel gives the demo a public HTTPS address without opening a port on the router. The app shares this
  # container's network, so the tunnel is its only way in from outside; this PC itself never joins a tailnet.
  tailscale:
    profiles: [public]
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: einvoice-tailscale
    hostname: ${TS_HOSTNAME:-einvoice}
    environment:
      # From .env, never committed. Empty: the tunnel waits for a login and there is no public address.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-einvoice}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"               # no tun device, no capabilities needed
      TS_SERVE_CONFIG: /config/serve.json  # HTTPS on 443 -> the app on 127.0.0.1:8080, open to the internet (Funnel)
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./docker/tailscale/serve.json:/config/serve.json:ro
    # No ports: the tunnel is the only way in. (The app refuses plain HTTP from anywhere but the tunnel, so a local port
    # would not work anyway; use the public address, or the development app on https://localhost:7169.)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Ollama on this PC (Docker Desktop has it anyway)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    restart: unless-stopped

  web:
    profiles: [public]
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: einvoice-web:local
    container_name: einvoice-web
    network_mode: service:tailscale
    depends_on:
      db-init:
        condition: service_completed_successfully
      kosit-validator:
        condition: service_healthy
      mock-erp:
        condition: service_started
      tailscale:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__EInvoice: "Server=sqlserver,1433;Database=EInvoice;User Id=einvoice_app;Password=${EINVOICE_APP_PASSWORD:?Set EINVOICE_APP_PASSWORD in .env - see .env.example};Encrypt=True;TrustServerCertificate=True"
      Kosit__BaseUrl: http://kosit-validator:8080/
      Erp__Enabled: "true"
      Erp__BaseUrl: http://mock-erp:8080/
      Erp__ClientId: ${ERP_CLIENT_ID:-einvoice}
      Erp__ClientSecret: ${ERP_CLIENT_SECRET:-}   # from .env; empty: the app refuses to start
      # The local model on this PC's GPU (Ollama on 127.0.0.1:11434). AI_ENABLED=false in .env switches PDFs off.
      Ai__Enabled: ${AI_ENABLED:-true}
      Ai__OllamaUrl: http://host.docker.internal:11434/
      Ai__Model: ${AI_MODEL:-qwen2.5:7b}
      Demo__Enabled: "true"
      Tunnel__Enabled: "true"
      # The ERP sync's key, as its SHA-256 only (the key itself is with erp-sync). Empty: the sync API is closed.
      Sync__ApiKeySha256: ${SYNC_API_KEY_SHA256:-}
    volumes:
      - web-keys:/keys
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    restart: unless-stopped

  # The ERP sync (package 16c, sync/erp-sync): every 5 minutes it reads vendors, purchase orders and goods receipts
  # changed in the (mock) ERP and hands them to the app's sync API. Opt in: docker compose --profile public --profile sync
  # up -d. Needs SYNC_API_KEY and its SHA-256 SYNC_API_KEY_SHA256 in .env (see .env.example); without a key it stops.
  # It reaches the app inside the tunnel's network (the web container shares it), never through the internet.
  erp-sync:
    profiles: [sync]
    build: ./sync/erp-sync
    image: einvoice-erp-sync:local
    container_name: einvoice-erp-sync
    depends_on:
      web:
        condition: service_started
      mock-erp:
        condition: service_started
    environment:
      ERP_BASE_URL: http://mock-erp:8080/
      ERP_CLIENT_ID: ${ERP_CLIENT_ID:-einvoice}
      ERP_CLIENT_SECRET: ${ERP_CLIENT_SECRET:-}
      APP_BASE_URL: http://tailscale:8080/
      SYNC_API_KEY: ${SYNC_API_KEY:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-5m}
      SYNC_RUN_TIMEOUT: ${SYNC_RUN_TIMEOUT:-4m}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    restart: unless-stopped

  # Every night at 03:00 Berlin time the public demo's database is dropped and built again by db-init's script
  # (db/demo). Everything visitors did is gone, the seed is back. At once: docker compose --profile public run --rm demo-reset now
  demo-reset:
    profiles: [public]
    image: *sqlserver-image
    container_name: einvoice-demo-reset
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env - see .env.example}
      EINVOICE_APP_PASSWORD: ${EINVOICE_APP_PASSWORD:?Set EINVOICE_APP_PASSWORD in .env - see .env.example}
      RESET_AT: ${RESET_AT:-03:00}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/demo/nightly.sh"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    restart: unless-stopped

volumes:
  sqldata:
  tailscale-state:
  web-keys:
