name: einvoice-inbox

x-sqlserver-image: &sqlserver-image mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04

services:
  sqlserver:
    image: *sqlserver-image
    container_name: einvoice-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Required. Set it in .env (copy .env.example). Never commit the real value.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env - see .env.example}
    ports:
      # Loopback only: the database is not reachable from other machines.
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # Password via SQLCMDPASSWORD, not -P, so it does not appear in process listings.
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot: creates the database, applies migrations, creates the app user, loads seed data, then exits.
  db-init:
    image: *sqlserver-image
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env - see .env.example}
      EINVOICE_APP_PASSWORD: ${EINVOICE_APP_PASSWORD:?Set EINVOICE_APP_PASSWORD in .env - see .env.example}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "/db/init.sh"]
    restart: "no"

  # KoSIT validator (EN 16931 + XRechnung 3.0.2). Built from pinned, checksum-verified downloads; see docker/kosit-validator.
  kosit-validator:
    build: ./docker/kosit-validator
    image: einvoice-kosit-validator:1.6.3-xr-2026-08-31
    container_name: einvoice-kosit-validator
    ports:
      - "127.0.0.1:${KOSIT_PORT:-8081}:8080"
    # Hardening: read-only filesystem, no Linux capabilities, no privilege escalation, bounded memory.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/server/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqldata:
